name: compact

# Folds every backfill checkpoint staged on the shared `backfill-staging`
# release into the canonical <date>.parquet day files (dedup union) and
# refresh_state.json, then deletes the staging assets. Run once, after every
# backfill.yml shard has finished. Safe to re-run (a no-op once staging is
# empty). This is the ONLY step that commits manifest.json / refresh_state.json
# for backfilled data -- one serialized job, no concurrent-write races.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compact
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_REPO: jjerry0519/broker-branch-tracker-data
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Compact staging -> canonical
        run: python -m ingest.run --mode compact

      - name: Commit manifest / refresh state / log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- manifest.json refresh_state.json logs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: compact $(date -u +%F) [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
