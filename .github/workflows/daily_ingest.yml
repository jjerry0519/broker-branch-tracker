name: daily-ingest

# TWSE (上市) leg: runs on GitHub-hosted runners — verified working.
# TPEx (上櫃) leg: TPEx's Cloudflare edge ERR_ABORTs the GitHub Actions IP ranges,
#   and neither warp-cli nor wgcf/WireGuard establishes a tunnel inside the runner
#   (UDP egress blocked). So scheduled cloud runs skip TPEx (TPEX_ENABLED=0); the
#   TPEx leg runs elsewhere (see README "TPEx hosting"). Manual dispatch can still
#   force it on for experiments via the skip_tpex=false input.

on:
  schedule:
    - cron: "0 10 * * 1-5"          # 18:00 Asia/Taipei, Mon-Fri
  workflow_dispatch:
    inputs:
      date:
        description: "ISO date to ingest (default: latest published trading day)"
        required: false
        type: string
      skip_tpex:
        description: "Skip the TPEx leg (default true on cloud runners — TPEx is IP-blocked here)"
        required: false
        default: true
        type: boolean
      twse_limit:
        description: "Cap TWSE stocks (fast smoke test). Empty = no cap."
        required: false
        default: ""
        type: string
      tpex_limit:
        description: "Cap TPEx stocks (only meaningful with skip_tpex=false)."
        required: false
        default: ""
        type: string

permissions:
  contents: write                    # commit manifest/log/reference back to this public repo

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Parquet assets are uploaded to the PRIVATE data repo via `gh` (reads GH_TOKEN).
      GH_REPO: jjerry0519/broker-branch-tracker-data
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      # Scheduled runs have no inputs -> skip_tpex defaults true -> TPEX_ENABLED=0.
      TPEX_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_tpex == false) && '1' || '0' }}
      TWSE_LIMIT: ${{ inputs.twse_limit || '0' }}
      TPEX_LIMIT: ${{ inputs.tpex_limit || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install patchright Chromium (only if TPEx is on)
        if: ${{ env.TPEX_ENABLED == '1' }}
        run: |
          python -m patchright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Weekly reference refresh (Mondays only)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python -c "from ingest.reference import refresh_reference_db; print(refresh_reference_db())"
          else
            echo "not Monday (UTC) -- skipping reference refresh"
          fi

      - name: Ingest
        env:
          date: ${{ inputs.date }}
        run: |
          if [ "$TPEX_ENABLED" = "1" ]; then
            xvfb-run -a python -m ingest.run ${date:+--date $date}
          else
            python -m ingest.run ${date:+--date $date}
          fi

      - name: Commit manifest / log / reference
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- manifest.json logs reference.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: ingest $(date -u +%F) [skip ci]"
            git push
          fi
