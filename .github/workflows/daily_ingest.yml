name: daily-ingest

# Architecture A over the SysJust .djhtm mirrors -- plain HTTP, no browser.
# Per run: zco top-15/15 sweep (every stock, same day) + one 1/CYCLE_DAYS
# rolling zco0 shard (full history for its slice of the stock x branch matrix).
# The PC does not need to be on -- this is the whole pipeline.

on:
  schedule:
    - cron: "30 10 * * 1-5"        # 18:30 Asia/Taipei, Mon-Fri
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if today is already marked done"
        type: boolean
        default: false
      skip_sweep:
        description: "Skip the zco top-15/15 board sweep"
        type: boolean
        default: false
      stock_limit:
        description: "Cap the universe (smoke test). 0 = no cap."
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # first cycle uses 45-day windows; steady state is ~1h
    env:
      GH_REPO: jjerry0519/broker-branch-tracker-data
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      CYCLE_DAYS: "20"
      WORKERS: "24"
      STOCK_LIMIT: ${{ inputs.stock_limit || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Weekly reference refresh (Mondays)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python -c "from ingest.reference import refresh_reference_db; print(refresh_reference_db())"
          else
            echo "not Monday (UTC) -- skip reference refresh"
          fi

      - name: Ingest
        run: |
          python -m ingest.run --mode daily \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.skip_sweep && '--skip-sweep' || '' }}

      - name: Commit manifest / log / refresh state / reference
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- manifest.json refresh_state.json logs reference.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: daily ingest $(date -u +%F) [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
