name: backfill

# One-time historical fill: one zco0 range request per (stock, branch) over the
# last `months` months. The full matrix is ~1.5M cells, so run this once per
# `shard` value (e.g. 1/24 .. 24/24) -- each shard is a contiguous slice of the
# stock universe. Every --flush-every stocks (default 10) it checkpoints ONE
# data file + ONE small state file to the shared `backfill-staging` release
# (not one file per date -- that burned the token's whole 5000/hr API quota
# within minutes on 2026-09-11 with 24 shards running at once).
#
# Shards do NOT commit anything to the code repo -- 20+ parallel `git commit +
# rebase + push` against the same manifest.json/refresh_state.json is exactly
# as racy as the old per-date uploads were (also failed on 2026-09-11: rebase
# conflicts). Only `compact.yml` (a single serialized job, run once after every
# shard finishes) folds staging into the canonical day files and commits
# manifest.json / refresh_state.json.

on:
  workflow_dispatch:
    inputs:
      shard:
        description: 'Stock slice "i/N" (e.g. 3/24). Empty = whole universe.'
        type: string
        default: "1/24"
      months:
        description: "How many months back to reach"
        type: string
        default: "15"
      stock_limit:
        description: "Cap the universe before slicing (smoke test). 0 = no cap."
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: backfill-${{ inputs.shard }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_REPO: jjerry0519/broker-branch-tracker-data
      GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      WORKERS: "16"
      STOCK_LIMIT: ${{ inputs.stock_limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Backfill shard ${{ inputs.shard }}
        run: |
          python -m ingest.run --mode backfill \
            --shard "${{ inputs.shard }}" --months "${{ inputs.months }}"
