name: trigger-space

# The full ingest (TWSE + TPEx) runs on the Hugging Face Space, not here —
# GitHub Actions IPs are rate-limited by TWSE BSR and blocked by TPEx.
# This workflow only:
#   * keeps the free Space awake (GET / every 6h)
#   * kicks off one ingest per trading day (POST /run ~17:45 Asia/Taipei)
#
# Repo settings needed:
#   variable  SPACE_URL          e.g. https://jjerry0519-broker-branch-ingest.hf.space
#   secret    SPACE_RUN_TOKEN    same string as the Space's RUN_TOKEN secret

on:
  schedule:
    - cron: "0 */6 * * *"       # keep-alive
    - cron: "45 9 * * 1-5"      # 17:45 Asia/Taipei, Mon-Fri -> start ingest
  workflow_dispatch:
    inputs:
      date:
        description: "ISO date to ingest (optional)"
        required: false
        type: string
      force:
        description: "Re-ingest even if the date is already in the manifest"
        required: false
        default: false
        type: boolean

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake / keep-alive
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ vars.SPACE_URL }}/" || true)
            echo "GET / -> $code"
            [ "$code" = "200" ] && break
            sleep 15
          done

      - name: Start ingest (daily 17:45 TW, or manual)
        if: ${{ github.event.schedule == '45 9 * * 1-5' || github.event_name == 'workflow_dispatch' }}
        run: |
          q=""
          [ -n "${{ inputs.date }}" ] && q="?date=${{ inputs.date }}"
          [ "${{ inputs.force }}" = "true" ] && q="${q:+$q&}${q:-?}force=1"
          echo "POST /run$q"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 60 \
                   -X POST -H "X-Token: ${{ secrets.SPACE_RUN_TOKEN }}" \
                   "${{ vars.SPACE_URL }}/run$q" || true)
          echo "HTTP $code"; cat /tmp/r.json || true
          [ "$code" = "200" ] || { echo "::error::Space /run did not accept"; exit 1; }
